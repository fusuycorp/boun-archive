name: Build and Push to Custom Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "Triggering Dokploy deployment via Webhook URL..."
            curl -f -s -S -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"ref": "refs/heads/main"}'
          elif [ -n "${{ secrets.DOKPLOY_API_KEY }}" ] && [ -n "${{ secrets.DOKPLOY_URL }}" ]; then
            echo "Triggering Dokploy deployment via REST API..."
            curl -f -s -S -X POST "${{ secrets.DOKPLOY_URL }}/api/application.redeploy" \
              -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"applicationId": "${{ secrets.DOKPLOY_APPLICATION_ID }}"}'
          else
            echo "::error::Neither DOKPLOY_WEBHOOK_URL nor DOKPLOY_API_KEY/DOKPLOY_URL secrets are configured."
            exit 1
          fi

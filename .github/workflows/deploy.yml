name: Build, Push and Deploy

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  verify:
    name: Verify Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Backend Import & Tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -c "from app.main import app"
          CI=true uv run pytest -q

      - name: Verify Frontend Check, Tests & Build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build

  build-backend:
    name: Build & Push Backend
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-frontend:
    name: Build & Push Frontend
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Trigger Remote Deployment
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cluster Redeployment
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || secrets.DOKPLOY_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY || secrets.DOKPLOY_API_KEY }}
          DEPLOY_STACK_ID: ${{ secrets.DEPLOY_STACK_ID || secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          echo "Triggering cluster redeployment..."
          PAYLOAD=$(jq -n --arg id "$DEPLOY_STACK_ID" '{composeId: $id}')
          curl --max-time 30 -f -s -S -X POST "$DEPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DEPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

name: Build, Push and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  build-frontend:
    name: Build & Push Frontend
    runs-on: [self-hosted, builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Custom Registry
        uses: docker/login-action@v3
        with:
          registry: registry.bogazici.app
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: registry.bogazici.app/budok/boun-archive-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    name: Trigger Remote Deployment
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, builder]
    steps:
      - name: Trigger Cluster Redeployment
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL || secrets.DOKPLOY_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY || secrets.DOKPLOY_API_KEY }}
          DEPLOY_STACK_ID: ${{ secrets.DEPLOY_STACK_ID || secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          echo "Triggering cluster redeployment..."
          curl -f -s -S -X POST "$DEPLOY_URL/api/compose.redeploy" \
            -H "x-api-key: $DEPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DEPLOY_STACK_ID\"}"

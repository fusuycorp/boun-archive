<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
		<title>BOUN Archive</title>
		<script defer src="https://umami.bogazici.app/script.js" data-website-id="f58e2223-ae5b-4963-9663-2bb7d0da6cb3"></script>
		<script>
			window.addEventListener('vite:preloadError', () => {
				const key = 'last_chunk_reload_timestamp';
				const lastReload = Number(sessionStorage.getItem(key) || 0);
				if (Date.now() - lastReload > 10000) {
					sessionStorage.setItem(key, String(Date.now()));
					window.location.reload();
				}
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

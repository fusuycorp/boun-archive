[project]
name = "boun-archive"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "meilisearch>=0.41.0",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "redis>=4.2.0,<5.0.0",
    "backend",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
backend = { workspace = true }


version: '3.8'

services:
  db:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '1.0'
          memory: 2G
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.50'
          memory: 512M
        limits:
          cpus: '1.0'
          memory: 1.5G

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyLongEnough123}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: 104857600 # 100MB
    volumes:
      - meilisearch_data:/data.ms
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '1.0'
          memory: 2G
        limits:
          cpus: '4.0'
          memory: 6G

  backend:
    image: ${BACKEND_IMAGE:-registry.bogazici.app/budok/boun-archive-backend:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://boun_user:boun_password@db:5432/boun_archive}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyLongEnough123}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${BACKEND_PORT:-8000}
      # Higher worker count for high concurrency
      WEB_CONCURRENCY: 4
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 4
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.50'
          memory: 1G
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    image: ${FRONTEND_IMAGE:-registry.bogazici.app/budok/boun-archive-frontend:latest}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PORT: ${FRONTEND_PORT}
    networks:
      - frontend_net
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == tanri
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.0'
          memory: 1G

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_config_v1
        target: /etc/nginx/nginx.conf
    networks:
      - frontend_net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.type == tanri
      resources:
        reservations:
          cpus: '0.25'
          memory: 128M
        limits:
          cpus: '1.0'
          memory: 512M

configs:
  nginx_config_v1:
    file: ./nginx.conf

networks:
  backend_net:
    driver: overlay
    internal: true
  frontend_net:
    driver: overlay

volumes:
  postgres_data:
  meilisearch_data:

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.20'
          memory: 512M
        limits:
          cpus: '0.75'
          memory: 1.5G

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.10'
          memory: 128M
        limits:
          cpus: '0.25'
          memory: 256M

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyLongEnough123}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.50'
          memory: 1G
        limits:
          cpus: '1.0'
          memory: 2G

  backend:
    image: ${BACKEND_IMAGE:-registry.bogazici.app/budok/boun-archive-backend:latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://boun_user:boun_password@db:5432/boun_archive}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyLongEnough123}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${BACKEND_PORT:-8000}
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == worky
      resources:
        reservations:
          cpus: '0.25'
          memory: 512M
        limits:
          cpus: '1.0'
          memory: 1G

  frontend:
    image: ${FRONTEND_IMAGE:-registry.bogazici.app/budok/boun-archive-frontend:latest}
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PORT: ${FRONTEND_PORT}
    networks:
      - frontend_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == tanri
      resources:
        reservations:
          cpus: '0.10'
          memory: 128M
        limits:
          cpus: '0.50'
          memory: 512M

  nginx:
    image: nginx:alpine
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - frontend_net
    deploy:
      placement:
        constraints:
          - node.labels.type == tanri
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          cpus: '0.25'
          memory: 128M

configs:
  nginx_config:
    file: ./nginx.conf

networks:
  backend_net:
    driver: overlay
    internal: true
  frontend_net:
    driver: overlay

volumes:
  postgres_data:
  meilisearch_data:

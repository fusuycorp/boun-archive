events {
    worker_connections 20000;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # Docker internal DNS - essential for variable-based proxy_pass
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 3000;

        # Frontend
        location / {
            set $frontend_host frontend:3000;
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Static file caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
                set $frontend_static frontend:3000;
                proxy_pass http://$frontend_static;
                expires 1y;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Backend API - Preserve URI after stripping /api/
        location /api/ {
            set $backend_host backend:8000;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

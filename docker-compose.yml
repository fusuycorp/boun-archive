services:
  db:
    image: postgres:16-alpine
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=12GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boun_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boun_password}
      POSTGRES_DB: ${POSTGRES_DB:-boun_archive}
      PGPORT: ${DB_PORT_INTERNAL:-5432}
    expose:
      - "${DB_PORT_INTERNAL:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boun_user -d boun_archive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_HTTP_ADDR: "0.0.0.0:${MEILI_PORT_INTERNAL:-7700}"
    expose:
      - "${MEILI_PORT_INTERNAL:-7700}"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boun_user}:${POSTGRES_PASSWORD:-boun_password}@${DB_HOST:-db}:${DB_PORT_INTERNAL:-5432}/${POSTGRES_DB:-boun_archive}
      MEILI_URL: http://${MEILI_HOST:-meilisearch}:${MEILI_PORT_INTERNAL:-7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      REDIS_URL: redis://redis:6379
      BACKEND_PORT_INTERNAL: ${BACKEND_PORT_INTERNAL:-8000}
    expose:
      - "${BACKEND_PORT_INTERNAL:-8000}"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      PUBLIC_API_URL: ""
      PORT: ${FRONTEND_PORT_INTERNAL:-3000}
    expose:
      - "${FRONTEND_PORT_INTERNAL:-3000}"
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  meilisearch_data:
